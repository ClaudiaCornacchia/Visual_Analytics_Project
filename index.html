<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tweet Embeddings VA</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { display: flex; font-family: sans-serif; margin: 0; }
        #scatterplot-container { width: 70vw; height: 100vh; background: #f9f9f9; }
        #details-panel { width: 30vw; height: 100vh; padding: 20px; box-sizing: border-box; background: #fff; border-left: 1px solid #ccc; }
        .positive { fill: #2ca02c; } /* Standard green */
        .negative { fill: #d62728; } /* Standard red */
        .neutral { fill: #b3b3b3; }  /* Standard gray */
        circle { opacity: 0.7; stroke: #333; stroke-width: 0.5px; }
        circle:hover { stroke-width: 2px; opacity: 1; cursor: pointer; }
    </style>
</head>
<body>

    <div id="scatterplot-container">
       <div style="padding: 10px; background: #eee; border-bottom: 1px solid #ccc;">
            <strong>Color by: </strong>
            <button id="btn-color-sentiment">Sentiment</button>
            <button id="btn-color-airline">Airline</button>
        </div>
        
        <svg id="map" width="100%" height="calc(100% - 40px)"></svg>
    </div>

    <div id="details-panel">
        <h2>Tweet Details</h2>
        <p><strong>ID:</strong> <span id="tw-id">-</span></p>
        <p><strong>Sentiment:</strong> <span id="tw-sentiment">-</span></p>
        <p><strong>Original Text:</strong></p>
        <p id="tw-text" style="font-style: italic; background: #eee; padding: 10px;">Select a point on the map...</p>
        
        <hr>
        <h3>Perturbations (Analytics)</h3>
        <button id="btn-synonym" disabled>Replace Synonyms</button>
        <button id="btn-noise" disabled>Add Noise</button>
        
        <div id="results-area" style="display: none; margin-top: 20px;">
            <p><strong>New Text:</strong> <span id="new-text"></span></p>
            <p><strong>Cosine Similarity:</strong> <span id="similarity-score"></span></p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
